<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fusion Drop Mockup</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1280px;
    height: 720px;
    background: #f8f9fb;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
  }

  /* Background crystalline mesh */
  .bg-mesh {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background:
      radial-gradient(ellipse at 15% 25%, rgba(255,100,100,0.08) 0%, transparent 50%),
      radial-gradient(ellipse at 85% 20%, rgba(100,200,255,0.08) 0%, transparent 50%),
      radial-gradient(ellipse at 50% 80%, rgba(255,220,100,0.06) 0%, transparent 50%),
      linear-gradient(135deg, #f0f2f5 0%, #f8f9fb 50%, #eef1f5 100%);
    z-index: 0;
  }

  /* Title */
  .title-wrap {
    position: relative;
    z-index: 10;
    margin-top: 14px;
    text-align: center;
  }
  .title {
    font-size: 42px;
    font-weight: 900;
    letter-spacing: 8px;
    text-transform: uppercase;
    background: linear-gradient(
      90deg,
      #ff5e5e 0%, #ffb347 15%, #ffe135 30%,
      #47e47a 45%, #4facfe 60%, #a855f7 75%, #ff5e5e 100%
    );
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.08));
    position: relative;
  }
  .title::after {
    content: attr(data-text);
    position: absolute;
    left: 2px; top: 2px;
    background: linear-gradient(90deg, rgba(255,0,0,0.15), rgba(0,0,255,0.15));
    -webkit-background-clip: text;
    background-clip: text;
    z-index: -1;
    filter: blur(3px);
    opacity: 0.5;
  }
  .subtitle {
    font-size: 11px;
    color: #8898aa;
    letter-spacing: 4px;
    margin-top: 2px;
  }

  /* Main layout */
  .main {
    display: flex;
    flex: 1;
    width: 1220px;
    margin-top: 10px;
    gap: 18px;
    z-index: 5;
  }

  /* Left Panel */
  .panel {
    width: 220px;
    background: rgba(255,255,255,0.75);
    border: 1px solid rgba(200,210,230,0.5);
    border-radius: 16px;
    backdrop-filter: blur(6px);
    padding: 18px 14px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.04);
  }
  .panel h3 {
    font-size: 13px;
    color: #6b7c93;
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 6px;
    font-weight: 700;
  }
  .score-box {
    background: rgba(255,255,255,0.9);
    border: 1px solid rgba(220,230,245,0.8);
    border-radius: 12px;
    padding: 14px;
    text-align: center;
  }
  .score-label { font-size: 11px; color: #9aaabe; letter-spacing: 1px; }
  .score-value { font-size: 32px; font-weight: 800; color: #3a4a5e; margin-top: 4px; }
  .score-best { font-size: 11px; color: #b0c0d0; margin-top: 4px; }

  /* Next preview hex */
  .next-box {
    background: rgba(255,255,255,0.9);
    border: 1px solid rgba(220,230,245,0.8);
    border-radius: 12px;
    padding: 14px;
    text-align: center;
    position: relative;
  }
  .hex-preview {
    width: 64px; height: 74px;
    margin: 8px auto;
    position: relative;
  }
  .hex-svg {
    width: 100%; height: 100%;
    filter: drop-shadow(0 3px 6px rgba(0,0,0,0.1));
  }

  /* Center canvas */
  .canvas-wrap {
    flex: 1;
    position: relative;
    background: rgba(255,255,255,0.6);
    border: 1px solid rgba(200,210,230,0.5);
    border-radius: 16px;
    backdrop-filter: blur(4px);
    overflow: hidden;
    box-shadow: 0 4px 20px rgba(0,0,0,0.04);
  }
  .canvas-inner {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
  }

  /* Game shapes */
  .shape {
    position: absolute;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.12));
    transition: transform 0.3s ease;
  }

  /* Right panel fusion chain */
  .chain-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    align-items: center;
  }
  .chain-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: #5a6a7a;
  }
  .chain-shape {
    width: 28px; height: 28px;
    flex-shrink: 0;
  }
  .chain-arrow {
    color: #a0b0c0;
    font-size: 14px;
  }

  /* Bottom progress */
  .bottom-bar {
    width: 1220px;
    margin: 10px 0 16px;
    display: flex;
    align-items: center;
    gap: 14px;
    z-index: 5;
  }
  .progress-label {
    font-size: 12px;
    color: #7a8a9a;
    font-weight: 700;
    letter-spacing: 1px;
    min-width: 90px;
  }
  .progress-track {
    flex: 1;
    height: 18px;
    background: rgba(220,230,245,0.6);
    border-radius: 9px;
    position: relative;
    overflow: hidden;
    border: 1px solid rgba(200,210,230,0.5);
  }
  .progress-fill {
    height: 100%;
    width: 62%;
    background: linear-gradient(90deg, #4facfe, #a855f7, #ff5e5e);
    border-radius: 9px;
    position: relative;
  }
  .progress-fill::after {
    content: '';
    position: absolute;
    right: -9px; top: -3px;
    width: 24px; height: 24px;
    background: #fff;
    border: 2px solid #a855f7;
    border-radius: 50%;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
  }
  .progress-hexes {
    display: flex;
    gap: 6px;
  }
  .p-hex {
    width: 14px; height: 16px;
    opacity: 0.25;
  }
  .p-hex.filled { opacity: 1; }

  /* Light burst decorations */
  .burst {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
    mix-blend-mode: screen;
  }

  /* Canvas grid lines */
  .grid-line {
    position: absolute;
    background: rgba(180,200,220,0.15);
  }
  .grid-v { width: 1px; height: 100%; }
  .grid-h { height: 1px; width: 100%; }
</style>
</head>
<body>

<div class="bg-mesh"></div>

<div class="title-wrap">
  <div class="title" data-text="FUSION DROP">FUSION DROP</div>
  <div class="subtitle">Abstract Fusion Game</div>

<div class="main">
  <!-- Left Panel -->

      <!-- Complex fused shape (two hexagons merged) -->

            <filter id="glow3"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
          </defs>

      </div>
      <div class="chain-item">
